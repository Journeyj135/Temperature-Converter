<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <div class="temp-container">
          <h2 id="header">Temperature Converter</h2>
          <div class="celsius">
            <h5>Celsius:</h5>
            <input id="celsius-temp" placeholder="Enter Temperature" />
          </div>
          <div class="Fahrenheit">
            <h5>Fahrenheit:</h5>
            <input id="Fahrenheit-temp" placeholder="Enter Temperature" />
          </div>
          <div class="kelvin">
            <h5>kelvin:</h5>
            <input id="kelvin-temp" placeholder="Enter Temperature" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
