<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
  </head>
  <body>
    <div class="container">
      <div class="temp-container">
        <h5>Temperature Converter</h5>
        <div class="celsius">
          <h6>Celsius:</h6>
          <input id="celsius-temp" placeholder="Enter Temperature" />
        </div>
        <div class="Fahrenheit">
          <h6>Fahrenheit:</h6>
          <input id="Fahrenheit-temp" placeholder="Enter Temperature" />
        </div>
        <div class="kelvin">
          <h6>kelvin:</h6>
          <input id="kelvin-temp" placeholder="Enter Temperature" />
        </div>
      </div>
    </div>
  </body>
</html>
